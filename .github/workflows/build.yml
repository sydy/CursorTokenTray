# GitHub Actions：测试 + Windows / macOS 自动打包
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # 旧制品仍按 90 天默认过期，已占满 Actions 存储配额（~1.6GB）。
  # GitHub 配额按 6–12 小时重算，所以合入 main 不能再走 upload-artifact。
  cleanup-artifacts:
    name: Cleanup artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete stored Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while :; do
            mapfile -t ids < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
            if [ "${#ids[@]}" -eq 0 ] || [ -z "${ids[0]:-}" ]; then
              break
            fi
            for id in "${ids[@]}"; do
              [ -z "$id" ] && continue
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted ${deleted} artifacts (Actions storage quota)."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r requirements.txt pyinstaller pymupdf
      - name: Generate icons
        run: python assets/gen_app_icon.py
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm CursorTokenTray.spec
      - name: Zip onedir
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CursorTokenTray -DestinationPath CursorTokenTray-windows.zip -Force
      # 合入 / PR 不上传制品：配额满时 CreateArtifact 会把已经编过的 job 打红。
      # 手动 Run workflow 才尝试上传；配额仍满时忽略失败。
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: CursorTokenTray-windows
          path: CursorTokenTray-windows.zip
          if-no-files-found: error
          retention-days: 1
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: CursorTokenTray-windows.zip
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure tkinter
        run: |
          python -c "import tkinter" || brew install python-tk@3.12
      - name: Install deps
        run: python3 -m pip install -r requirements.txt pyinstaller pymupdf
      - name: Generate icons
        run: python3 assets/gen_app_icon.py
      - name: PyInstaller
        run: python3 -m PyInstaller --noconfirm CursorTokenTray.macos.spec
      - name: Zip .app
        run: ditto -c -k --keepParent dist/CursorTokenTray.app CursorTokenTray-macos.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: CursorTokenTray-macos
          path: CursorTokenTray-macos.zip
          if-no-files-found: error
          retention-days: 1
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: CursorTokenTray-macos.zip
          generate_release_notes: true
