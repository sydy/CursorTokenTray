# GitHub Actions：夹具测试 + Windows .NET / macOS Swift 打包
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python + .NET)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install test deps
      run: python -m pip install -r requirements.txt
    - name: Run Python fixture tests
      run: python -m unittest tests.test_fixtures tests.test_cursor_api tests.test_accounts -v
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"
    - name: Run C# core tests
      run: dotnet test windows/CursorTokenCore.Tests/CursorTokenCore.Tests.csproj -c Release --verbosity normal

  test-macos:
    name: Test (Swift)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Swift tests
      run: swift test --package-path macos

  cleanup-artifacts:
    name: Cleanup artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while :; do
            mapfile -t ids < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.name == \"CursorTokenTray-windows\" or .name == \"CursorTokenTray-macos\") | .id")
            if [ "${#ids[@]}" -eq 0 ] || [ -z "${ids[0]:-}" ]; then
              break
            fi
            for id in "${ids[@]}"; do
              [ -z "$id" ] && continue
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted ${deleted} old artifacts (Actions storage quota)."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single-file exe
        run: |
          dotnet publish windows/CursorTokenTray/CursorTokenTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=true -p:_SuppressWinFormsTrimError=true -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -o dist-win-files
          echo "---- largest published files ----"
          pwsh -NoProfile -Command "Get-ChildItem dist-win-files -File | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object { '{0,8:N2} MB  {1}' -f ($_.Length/1MB), $_.Name }"
          dotnet publish windows/CursorTokenTray/CursorTokenTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true -p:_SuppressWinFormsTrimError=true -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -o dist-win
      - name: Report exe size
        shell: pwsh
        run: |
          Get-ChildItem dist-win | ForEach-Object { '{0} {1:N2} MB' -f $_.Name, ($_.Length / 1MB) }
      - name: Zip onefile
        shell: pwsh
        run: |
          Compress-Archive -Path dist-win\CursorTokenTray.exe -DestinationPath CursorTokenTray-windows.zip -Force
          '{0} {1:N2} MB' -f 'CursorTokenTray-windows.zip', ((Get-Item CursorTokenTray-windows.zip).Length / 1MB)
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorTokenTray-windows
          path: CursorTokenTray-windows.zip
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package .app
        run: |
          chmod +x macos/scripts/package_app.sh
          ./macos/scripts/package_app.sh
      - name: Zip .app
        run: ditto -c -k macos/dist/release CursorTokenTray-macos.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorTokenTray-macos
          path: CursorTokenTray-macos.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [build-windows, build-macos]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: CursorTokenTray-windows
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: CursorTokenTray-macos
          path: dist
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/CursorTokenTray-windows.zip
            dist/CursorTokenTray-macos.zip
          body: |
            最新 `main` 构建（`${{ github.sha }}`），随每次合入覆盖更新。
            Windows 为 .NET 8 单文件 exe，macOS 为 Swift `.app`。
            从浏览器下载的 macOS 包若提示「已损坏」，请双击 zip 内的「首次打开.command」，或执行 `xattr -cr CursorTokenTray.app`。
            正式版请打 `v*` 标签。
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/CursorTokenTray-windows.zip
            dist/CursorTokenTray-macos.zip
          generate_release_notes: true
