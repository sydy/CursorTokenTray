# GitHub Actions：测试 + Windows / macOS 自动打包
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r requirements.txt pyinstaller pymupdf
      - name: Generate icons
        run: python assets/gen_app_icon.py
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm CursorTokenTray.spec
      - name: Zip onedir
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CursorTokenTray -DestinationPath CursorTokenTray-windows.zip -Force
      # PR 不上传：仓库制品配额满时 upload 会红，但 PyInstaller 已经验证过了。
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: CursorTokenTray-windows
          path: CursorTokenTray-windows.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure tkinter
        run: |
          python -c "import tkinter" || brew install python-tk@3.12
      - name: Install deps
        run: python3 -m pip install -r requirements.txt pyinstaller pymupdf
      - name: Generate icons
        run: python3 assets/gen_app_icon.py
      - name: PyInstaller
        run: python3 -m PyInstaller --noconfirm CursorTokenTray.macos.spec
      - name: Zip .app
        run: ditto -c -k --keepParent dist/CursorTokenTray.app CursorTokenTray-macos.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: CursorTokenTray-macos
          path: CursorTokenTray-macos.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
